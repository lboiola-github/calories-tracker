name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Pruebas de base de datos (migraciones + RLS)
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Pruebas e2e (emulando iPhone)
        run: npm run test:e2e
        env:
          CI: "true"
